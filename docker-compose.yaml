services:
  visitor:
    build:
      context: .
      dockerfile: ./Visitor/Dockerfile
    environment:
      MQHOST: rabbitmq
      LOGTRACE: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
    volumes:
      - visitor_logs:/logs

  urlextractor:
    build:
      context: .
      dockerfile: ./UrlExtractor/Dockerfile
    environment:
      MQHOST: rabbitmq
      LOGTRACE: 1
      DBHOST: dburls
      DBLOGIN: squaresearch
      DBPASSWORD: squaresearchpw
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_urls:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
    volumes:
      - urlextractor_logs:/logs
  
  urlqueuer:
    build:
      context: .
      dockerfile: ./UrlQueuer/Dockerfile
    environment:
      MQHOST: rabbitmq
      LOGTRACE: 1
      DBHOST: dburls
      DBLOGIN: squaresearch
      DBPASSWORD: squaresearchpw
      REVISIT_MINUTES: 1
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_urls:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 1
    volumes:
      - urlqueuer_logs:/logs

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 30s
      timeout: 30s
      retries: 3

  postgres_urls:
    container_name: dburls
    image: postgres:16
    environment:
      POSTGRES_USER: squaresearch
      POSTGRES_PASSWORD: squaresearchpw
      POSTGRES_DB: dburls
    # ports:
    #   - 5432:5432
    volumes:
      - postgres_urls_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U squaresearch -d dburls
      interval: 10s
      timeout: 3s
      retries: 3

  postgres_index:
    container_name: dbindex
    image: postgres:16
    environment:
      POSTGRES_USER: squaresearch
      POSTGRES_PASSWORD: squaresearchpw
      POSTGRES_DB: dbindex
    # ports:
    #   - 5432:5432
    volumes:
      - postgres_index_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U squaresearch -d dbindex
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_urls_data:
  postgres_index_data:
  rabbitmq_data:
  
  visitor_logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./logs
  
  urlextractor_logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./logs
  
  urlqueuer_logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./logs
